// --- Meal-planning helpers ---------------------------------------------------
function isoDate(d) {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
function planDays(n) {
  const out = [];
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  for (let i = 0; i < n; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    out.push(isoDate(d));
  }
  return out;
}
function dayLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  const today = isoDate(new Date());
  const tmrw = planDays(2)[1];
  if (iso === today) return "Today";
  if (iso === tmrw) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function recipeToSMS(r) {
  const macro = r.nutrition && r.nutrition.protein ? ` (${r.nutrition.protein}g protein, ${r.nutrition.calories} cal)` : "";
  const ings = (r.ingredients || []).join("; ");
  return `Tonight from Heather's Kitchen: ${r.title}${macro}.\n${r.cookMethod ? r.cookMethod + ", " : ""}${r.totalTime || ""}.\nNeed: ${ings}`.slice(0, 1200);
}
function sendToHeather(method, r, prefs) {
  const subject = `Tonight's dinner: ${r.title}`;
  if (method === "email") {
    const email = (prefs.heatherEmail || "").trim();
    const body = recipeToText(r) + "\n— from Heather's Kitchen";
    window.location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  } else {
    const phone = (prefs.heatherPhone || "").trim().replace(/[^\d+]/g, "");
    window.location.href = `sms:${phone}?&body=${encodeURIComponent(recipeToSMS(r))}`;
  }
}
function krogerSearch(item) {
  return `https://www.kroger.com/search?query=${encodeURIComponent(item)}`;
}
// Build an .ics with a dinner event per planned day + a morning (8am) alarm.
function buildICS(plan) {
  const pad = (n) => String(n).padStart(2, "0");
  const dt = (iso, h, m) => iso.replace(/-/g, "") + "T" + pad(h) + pad(m) + "00";
  const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Heathers Kitchen//Meal Plan//EN", "CALSCALE:GREGORIAN"];
  Object.keys(plan).sort().forEach((iso, i) => {
    const r = plan[iso];
    if (!r) return;
    const desc = recipeToText(r);
    lines.push(
      "BEGIN:VEVENT",
      `UID:hk-${iso}-${i}@heathers.kitchen`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${dt(iso, 17, 30)}`,
      `DTEND:${dt(iso, 18, 30)}`,
      `SUMMARY:Dinner — ${esc(r.title)}`,
      `DESCRIPTION:${esc(desc)}`,
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      `DESCRIPTION:${esc("Tonight: " + r.title)}`,
      "TRIGGER:-PT9H30M",
      "END:VALARM",
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(plan) {
  try {
    const blob = new Blob([buildICS(plan)], { type: "text/calendar" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "heathers-kitchen-meal-plan.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch (e) {}
}

// --- Date / season helpers ---------------------------------------------------
function dayContext() {
  const d = new Date();
  const weekday = d.toLocaleDateString("en-US", { weekday: "long" });
  const dateStr = d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const m = d.getMonth();
  const season = m <= 1 || m === 11 ? "Winter" : m <= 4 ? "Spring" : m <= 7 ? "Summer" : "Autumn";
  const isWeekend = [0, 6].includes(d.getDay());
  return { weekday, dateStr, season, isWeekend };
}

function hasStorage() {
  try { return typeof window !== "undefined" && !!window.localStorage; } catch { return false; }
}
async function storageGet(key, fallback) {
  if (!hasStorage()) return fallback;

  } catch { return fallback; }
}
async function storageSet(key, value) {

  catch { return false; }
}
async function storageProbe() {

}

async function fetchGroceryList(recipes, prefs, apiKey) {
  ensureKey(apiKey);
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 2000, messages: [{ role: "user", content: buildGroceryPrompt(recipes, prefs) }] }),
  });
  if (!res.ok) throw new Error(apiError(res.status));
  const data = await res.json();
  let text = extractTextBlocks(data.content).replace(/```json/gi, "").replace(/```/g, "").trim();
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a !== -1 && b !== -1) text = text.slice(a, b + 1);
  const parsed = JSON.parse(text);
  return (parsed.categories || []).filter((c) => c.items && c.items.length);
}

// --- API helpers -------------------------------------------------------------
function extractTextBlocks(content) {
  return (content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}
function parseRecipeArray(text) {
  let clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const first = clean.indexOf("[");
  const last = clean.lastIndexOf("]");
  if (first !== -1 && last !== -1 && last > first) clean = clean.slice(first, last + 1);
  let parsed;
  try {
    parsed = JSON.parse(clean);
  } catch {
    throw new Error("The chef's notes came back smudged (couldn't read the response). Give it another go.");
  }
  if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("No recipes came back. Try again.");
  return parsed;
}
function normalizeRecipes(parsed) {
  return parsed
    .slice(0, 3)
    .map((r, i) => ({
      rank: r.rank || i + 1,
      title: r.title || "Untitled",
      matchScore: typeof r.matchScore === "number" ? r.matchScore : 0,
      matchReasons: Array.isArray(r.matchReasons) ? r.matchReasons : [],
      cookMethod: r.cookMethod || "",
      totalTime: r.totalTime || "",
      activeTime: r.activeTime || "",
      difficulty: r.difficulty || "",
      servings: Number.isFinite(+r.servings) && +r.servings > 0 ? Math.round(+r.servings) : 0,
      cutNotes: r.cutNotes || "",
      doneness: r.doneness || "",
      veggiePairing: Array.isArray(r.veggiePairing) ? r.veggiePairing : [],
      ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
      steps: Array.isArray(r.steps) ? r.steps : [],
      proTips: Array.isArray(r.proTips) ? r.proTips : [],
      imageQuery: typeof r.imageQuery === "string" ? r.imageQuery : "",
      animal: typeof r.animal === "string" ? r.animal.toLowerCase() : "",
      nutrition: r.nutrition && typeof r.nutrition === "object"
        ? {
            calories: Math.max(0, Math.round(Number(r.nutrition.calories) || 0)),
            protein: Math.max(0, Math.round(Number(r.nutrition.protein) || 0)),
            carbs: Math.max(0, Math.round(Number(r.nutrition.carbs) || 0)),
            fat: Math.max(0, Math.round(Number(r.nutrition.fat) || 0)),
          }
        : null,
      source: r.source && typeof r.source === "object"
        ? {
            name: r.source.name || "",
            url: typeof r.source.url === "string" && /^https?:\/\//.test(r.source.url) ? r.source.url : "",
            rating: typeof r.source.rating === "number" ? r.source.rating : null,
            reviewCount: typeof r.source.reviewCount === "number" ? r.source.reviewCount : null,
            imageUrl: typeof r.source.imageUrl === "string" && /^https?:\/\/.+\.(jpe?g|png|webp|avif|gif)(\?|#|$)/i.test(r.source.imageUrl) ? r.source.imageUrl : "",
          }
        : null,
      adapted: r.adapted || "",
    }))
    .sort((a, b) => a.rank - b.rank);
}

// Ensure a stored/loaded recipe has all array fields (guards older saves).
function withDefaults(r) {
  r = r || {};
  return {
    ...r,
    title: r.title || "Untitled",
    matchReasons: Array.isArray(r.matchReasons) ? r.matchReasons : [],
    veggiePairing: Array.isArray(r.veggiePairing) ? r.veggiePairing : [],
    ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
    steps: Array.isArray(r.steps) ? r.steps : [],
    proTips: Array.isArray(r.proTips) ? r.proTips : [],
  };
}

// Plain-text version of a recipe for sharing / clipboard.
function recipeToText(r) {
  const L = [];
  L.push(r.title);
  const meta = [r.cookMethod, r.totalTime, r.servings ? `${r.servings} servings` : ""].filter(Boolean).join(" · ");
  if (meta) L.push(meta);
  if (r.source && (r.source.name || r.source.url)) L.push(`Source: ${[r.source.name, r.source.url].filter(Boolean).join(" ")}`);
  L.push("");
  if (r.veggiePairing && r.veggiePairing.length) {
    L.push("VEGETABLE PAIRING");
    r.veggiePairing.forEach((v) => L.push(`- ${v.veg}${v.prep ? ` — ${v.prep}` : ""}`));
    L.push("");
  }
  if (r.ingredients && r.ingredients.length) {
    L.push("INGREDIENTS");
    r.ingredients.forEach((i) => L.push(`- ${i}`));
    L.push("");
  }
  if (r.steps && r.steps.length) {
    L.push("METHOD");
    r.steps.forEach((s, i) => L.push(`${i + 1}. ${s}`));
    L.push("");
  }
  if (r.doneness) L.push(`Cook to: ${r.doneness}`);
  if (r.proTips && r.proTips.length) {
    L.push("TIPS");
    r.proTips.forEach((t) => L.push(`- ${t}`));
  }
  L.push("", "— from Heather's Kitchen");
  return L.join("\n");
}

// Render the card to an off-screen canvas (real image). Returns a canvas or null.
async function renderCardImage(r) {
  if (typeof html2canvas !== "function") return null;
  const node = document.createElement("div");
  node.className = "hk-scope";
  node.style.cssText = "position:fixed;left:-10000px;top:0;width:776px;background:#e3d0a6;padding:18px;";
  node.innerHTML = `<style>${cardCSS()}</style>` + cardInnerHTML(r);
  document.body.appendChild(node);
  try {
    return await html2canvas(node, { backgroundColor: "#e3d0a6", scale: 2, useCORS: true, logging: false });
  } finally {
    try { document.body.removeChild(node); } catch (e) {}
  }
}
function openWindowWith(html) {
  try {
    const w = window.open("", "_blank");
    if (w && w.document) { w.document.open(); w.document.write(html); w.document.close(); return true; }
  } catch (e) {}
  try {
    const iframe = document.createElement("iframe");
    iframe.setAttribute("aria-hidden", "true");
    iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(iframe);
    const d = iframe.contentWindow.document; d.open(); d.write(html); d.close();
    setTimeout(() => { try { document.body.removeChild(iframe); } catch (e) {} }, 12000);
    return true;
  } catch (e) { return false; }
}
function safeName(r) { return (r.title || "recipe").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase(); }
// Print the recipe as an old-style card image (reliable across environments).
async function printCard(r) {
  let dataUrl = null;
  try { const canvas = await renderCardImage(r); if (canvas) dataUrl = canvas.toDataURL("image/jpeg", 0.92); } catch (e) {}
  if (dataUrl) {
    // Print is triggered by the image's own load event so it can never fire
    // on a blank (not-yet-decoded) page; a safety timer covers edge cases.
    const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(withDefaults(r).title)} — Heather's Kitchen</title>
      <style>@page{margin:10mm;} html,body{margin:0;background:#fff;} img{display:block;width:100%;max-width:760px;margin:0 auto;}</style>
      </head><body><img id="c" src="${dataUrl}" alt="recipe">
      <script>
        var img=document.getElementById("c"), fired=false;
        function go(){ if(fired) return; fired=true; try{window.focus();window.print();}catch(e){} }
        window.addEventListener("afterprint",function(){try{window.close();}catch(e){}});
        if(img.complete && img.naturalWidth>0){ setTimeout(go,200); }
        else { img.addEventListener("load",function(){setTimeout(go,200);}); img.addEventListener("error",function(){setTimeout(go,200);}); }
        setTimeout(go,2000);
      <\/script>
      </body></html>`;
    if (openWindowWith(html)) return "print";
    try {
      const a = document.createElement("a");
      a.href = dataUrl; a.download = safeName(r) + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      return "downloaded";
    } catch (e) {}
  }
  // Final fallback: HTML print doc.
  const docHtml = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(withDefaults(r).title)}</title>
    <style>@page{margin:12mm;} html,body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;} ${cardCSS()}</style>
    <script>window.addEventListener("load",function(){setTimeout(function(){try{window.print();}catch(e){}},300);});<\/script>
    </head><body><div class="hk-scope" style="padding:16px;background:#e3d0a6;">${cardInnerHTML(r)}</div></body></html>`;
  return openWindowWith(docHtml) ? "print" : "unavailable";
}
// Share the same card image; fall back to text, then clipboard.
async function shareCard(r) {
  const text = recipeToText(r);
  try {
    const canvas = await renderCardImage(r);
    if (canvas && navigator.canShare) {
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      if (blob) {
        const file = new File([blob], safeName(r) + ".png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: r.title, text: r.title });
          return "shared";
        }
      }
    }
  } catch (e) { /* fall through */ }
  try { if (navigator.share) { await navigator.share({ title: r.title, text }); return "shared"; } } catch (e) { return "canceled"; }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return "copied"; } } catch (e) {}
  return "unavailable";
}

// Downscale an uploaded image to a data URL + base64 (keeps storage small).
function fileToScaledImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality || 0.82);
      resolve({ dataUrl, base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that image.")); };
    img.src = url;
  });
}
// Read a photo/screenshot of a recipe and extract it into our recipe format.
async function importRecipeFromImage(base64, mediaType, apiKey) {
  ensureKey(apiKey);
  const prompt = `You are reading a photo or screenshot of a single recipe. Extract it into JSON with EXACTLY these fields:
{"title":"","cookMethod":"","totalTime":"","activeTime":"","difficulty":"","servings":0,"cutNotes":"","doneness":"","veggiePairing":[{"veg":"","prep":"","why":""}],"ingredients":[""],"steps":[""],"proTips":[""],"imageQuery":""}
Keep ingredient and step text faithful to what's shown. Use empty strings/arrays and 0 for anything not present. "imageQuery" = 2-3 plain words naming the dish. Respond with ONLY the JSON object — no markdown, no code fences, no commentary.`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
        { type: "text", text: prompt },
      ] }],
    }),
  });
  if (!res.ok) throw new Error(apiError(res.status));
  const data = await res.json();
  let text = extractTextBlocks(data.content).replace(/```json/gi, "").replace(/```/g, "").trim();
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a !== -1 && b !== -1 && b > a) text = text.slice(a, b + 1);
  let obj;
  try { obj = JSON.parse(text); } catch { throw new Error("Couldn't read a recipe from that image — try a clearer, straight-on photo."); }
  if (!obj || !obj.title) throw new Error("No recipe found in that image. Try a clearer photo.");
  return normalizeRecipes([obj])[0];
}

// Clear, friendly errors for common API failures.
function ensureKey(key) {
  if (!key || /PASTE-/.test(key)) {
    throw new Error("No API key yet. Tap the gear icon (Tune) and paste your Anthropic API key (it starts with sk-ant-).");
  }
}
function apiError(status) {
  if (status === 401) return "API key rejected (401). Check that the key in index.html is your full, valid Anthropic key (starts with sk-ant-) with no extra spaces or quotes.";
  if (status === 429) return "Rate limited (429). Wait a moment, then try again.";
  if (status === 503 || status === 529) return "Anthropic is overloaded right now. Try again in a minute.";
  return `Request failed (HTTP ${status}). Try again.`;
}

// Non-grounded: single completion from culinary knowledge.
async function fetchRecipes(prompt, apiKey) {
  ensureKey(apiKey);
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 8000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) throw new Error(apiError(res.status));
  const data = await res.json();
  return normalizeRecipes(parseRecipeArray(extractTextBlocks(data.content)));
}

// Grounded: let the model search the web, then return JSON citing real sources.
// Server-side web_search can pause a long turn; we resume on stop_reason "pause_turn".
async function fetchGroundedRecipes(prompt, apiKey) {
  ensureKey(apiKey);
  const messages = [{ role: "user", content: prompt }];
  let finalContent = null;
  const MAX_LOOPS = 8;
  for (let i = 0; i < MAX_LOOPS; i++) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 8000,
        messages,
        tools: [{ type: "web_search_20250305", name: "web_search", max_uses: 4 }],
      }),
    });
    if (!res.ok) throw new Error(apiError(res.status));
    const data = await res.json();
    // Keep the assistant turn (incl. server tool blocks) so the turn can resume.
    messages.push({ role: "assistant", content: data.content });
    finalContent = data.content;
    if (data.stop_reason === "pause_turn") continue; // resume the long-running turn
    break; // end_turn, max_tokens, etc.
  }
  return normalizeRecipes(parseRecipeArray(extractTextBlocks(finalContent)));
}

        @keyframes paneBack { from { opacity:0; transform: translateX(-16px);} to {opacity:1; transform:none;} }

        @keyframes popIn { 0% { opacity:0; transform: translateY(12px) scale(.96);} 60% { opacity:1; } 100% { opacity:1; transform:none;} }
        @keyframes ctaIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
        .rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
        .pane-in { animation: paneIn .36s cubic-bezier(.2,.8,.2,1) both; }
        .pane-back { animation: paneBack .36s cubic-bezier(.2,.8,.2,1) both; }
        .hk-btn { transition: transform .14s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, filter .2s ease; -webkit-tap-highlight-color: transparent; }
        .hk-btn:hover { filter: brightness(1.05); }
        .hk-btn:active { transform: scale(.96); }
        .hk-tile { animation: popIn .42s cubic-bezier(.2,.8,.2,1) both; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, border-color .2s ease; -webkit-tap-highlight-color: transparent; }
        .hk-tile:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(114,60,31,.18); border-color:${C.brass}; }
        .hk-tile:active { transform: translateY(-1px) scale(.985); }
        .hk-chip { transition: transform .12s ease, background .18s ease, border-color .18s ease, color .18s ease; -webkit-tap-highlight-color: transparent; }
        .hk-chip:hover { border-color:${C.brass} !important; }
        .hk-chip:active { transform: scale(.93); }
        .hk-cta { animation: ctaIn .3s ease both; }
        .btt-chip:hover { border-color:${C.brass} !important; }
        .btt-card { transition: transform .25s ease, box-shadow .25s ease; }
        .btt-card:hover { transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 10px; height:10px; }
        ::-webkit-scrollbar-thumb { background:${C.line}; border-radius:8px; }
      `}</style>

      {/* Header */}
      <header
        style={{
          background: `linear-gradient(180deg, ${C.oxbloodDeep}, ${C.oxblood})`,
          color: C.paper,
          borderBottom: `3px solid ${C.brass}`,
          boxShadow: "0 6px 24px rgba(0,0,0,.18)",
        }}
      >
        <div style={{ maxWidth: 1080, margin: "0 auto", padding: "16px 18px 16px", position: "relative" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 72, height: 72, borderRadius: 999, padding: 3, flexShrink: 0, background: `linear-gradient(135deg, ${C.brass}, ${C.brassDeep})`, boxShadow: "0 6px 18px rgba(0,0,0,.28)" }}>
              <div style={{ width: "100%", height: "100%", borderRadius: 999, overflow: "hidden", border: "2px solid #fff", background: "#fff" }}>
                <img src={LOGO_SRC} alt="Heather's Kitchen" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              </div>
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 28, lineHeight: 1.02, letterSpacing: ".3px" }}>
                Heather&rsquo;s Kitchen
              </div>
              <div style={{ fontSize: 14, opacity: 0.92, marginTop: 5, fontStyle: "italic", fontFamily: FONT_DISPLAY }}>
                It&rsquo;s good y&rsquo;all!
              </div>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", gap: 9, flexShrink: 0 }}>
              <button className="hk-btn" onClick={() => setShowPlanner(true)} title="Meal plan" aria-label="Meal plan" style={{ position: "relative", width: 42, height: 42, borderRadius: 999, border: `1.5px solid ${C.brass}`, background: "rgba(255,255,255,.1)", color: C.paper, cursor: "pointer", display: "grid", placeItems: "center" }}>
                <CalendarDays size={18} />
                {Object.keys(plan).length > 0 && (
                  <span style={{ position: "absolute", top: -5, right: -5, minWidth: 18, height: 18, padding: "0 4px", borderRadius: 999, background: C.brass, color: "#fff", fontSize: 11, fontWeight: 800, display: "grid", placeItems: "center", border: `1.5px solid ${C.oxbloodDeep}` }}>{Object.keys(plan).length}</span>
                )}
              </button>
              <button className="hk-btn" onClick={() => setShowFavs(true)} title="Favorites" aria-label="Favorites" style={{ position: "relative", width: 42, height: 42, borderRadius: 999, border: `1.5px solid ${C.brass}`, background: "rgba(255,255,255,.1)", color: C.paper, cursor: "pointer", display: "grid", placeItems: "center" }}>
                <Bookmark size={18} />
                {favorites.length > 0 && (
                  <span style={{ position: "absolute", top: -5, right: -5, minWidth: 18, height: 18, padding: "0 4px", borderRadius: 999, background: C.brass, color: "#fff", fontSize: 11, fontWeight: 800, display: "grid", placeItems: "center", border: `1.5px solid ${C.oxbloodDeep}` }}>{favorites.length}</span>
                )}
              </button>
              <button className="hk-btn" onClick={() => setShowPrefs(true)} title="Tune" aria-label="Tune" style={{ width: 42, height: 42, borderRadius: 999, border: `1.5px solid ${C.brass}`, background: "rgba(255,255,255,.1)", color: C.paper, cursor: "pointer", display: "grid", placeItems: "center" }}>
                <Settings size={18} />
              </button>
            </div>
          </div>
          <div style={{ marginTop: 11, fontSize: 12, opacity: 0.82, letterSpacing: ".06em", textTransform: "uppercase" }}>
            {ctx.weekday}, {ctx.dateStr} &middot; {ctx.season}
          </div>
        </div>
      </header>

      <main style={{ maxWidth: 1080, margin: "0 auto", padding: "18px 18px 64px" }}>
        {/* Selector */}
        <section className="rise" style={panel()}>
          {(() => {
            const items = [
              ...(prefs.haveProteinsList || []),
              ...((prefs.haveProteins || "").trim() ? [prefs.haveProteins.trim()] : []),
              ...(prefs.haveVeggies || []),
              ...((prefs.pantryExtra || "").trim() ? [prefs.pantryExtra.trim()] : []),
            ];
            const out = (prefs.spicesOut || []);
            const has = items.length > 0 || out.length > 0;
            const summary = items.length
              ? items.slice(0, 4).join(", ") + (items.length > 4 ? ` +${items.length - 4} more` : "") + (out.length ? ` · out of ${out.length} spice${out.length > 1 ? "s" : ""}` : "")
              : out.length
              ? `Out of: ${out.slice(0, 4).join(", ")}${out.length > 4 ? ` +${out.length - 4}` : ""}`
              : "Tap to tell the kitchen what you've got";
            return (
              <>
              <button
                className="hk-btn"
                onClick={() => setShowPantry(true)}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, padding: "11px 14px", marginBottom: 10, borderRadius: 12, cursor: "pointer", border: `1.5px solid ${has ? C.brass : C.line}`, background: has ? "#f5ecdb" : "#fff", textAlign: "left" }}
              >
                <div style={{ width: 32, height: 32, borderRadius: 999, display: "grid", placeItems: "center", background: C.paper2, border: `1.5px solid ${C.brass}`, flexShrink: 0 }}>
                  <Salad size={17} color={C.sage} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: C.ink, display: "flex", alignItems: "center", gap: 7 }}>
                    What&rsquo;s on hand
                    {items.length > 0 && <span style={{ fontSize: 11, fontWeight: 800, color: "#fff", background: C.oxblood, borderRadius: 999, padding: "1px 7px" }}>{items.length}{prefs.pantryStrict ? " · only" : ""}</span>}
                  </div>
                  <div style={{ fontSize: 12, color: C.inkSoft, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{summary}</div>
                </div>
                <ChevronDown size={18} color={C.inkSoft} style={{ transform: "rotate(-90deg)", flexShrink: 0 }} />
              </button>
              <button
                className={!loading ? "hk-btn" : ""}
                onClick={() => (has ? runPantry() : setShowPantry(true))}
                disabled={loading}
                style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 9, padding: "13px", marginBottom: 16, borderRadius: 12, cursor: loading ? "default" : "pointer", border: `1.5px solid ${C.sage}`, background: has ? "#eef0e2" : "#fff", color: C.ink, fontWeight: 800, fontFamily: FONT_DISPLAY, fontSize: 15 }}
              >
                <ChefHat size={18} color={C.sage} />
                {has ? "What can I make right now?" : "Add what's on hand to cook now"}
              </button>
              </>
            );
          })()}
          {step === "protein" && (
            <div key="protein" className="pane-in">
              <SectionTitle n="01" text="Choose your protein" />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
                {PROTEINS.map(({ key, label, Icon, blurb }, i) => {
                  const count = (prefs.preferredCuts || []).filter((p) => p.animal === key).length;
                  return (
                    <button
                      key={key}
                      className="hk-tile"
                      onClick={() => { setAnimal(key); setCut(null); setStep("cut"); }}
                      style={{
                        animationDelay: `${i * 0.07}s`,
                        display: "flex", flexDirection: "column", alignItems: "center", gap: 9,
                        padding: "20px 8px 16px", cursor: "pointer", borderRadius: 16,
                        border: `1px solid ${C.line}`, background: "#fff", textAlign: "center",
                        boxShadow: "0 2px 12px rgba(36,28,23,.06)",
                      }}
                    >
                      <div style={{ width: 54, height: 54, borderRadius: 999, display: "grid", placeItems: "center", background: `linear-gradient(150deg, ${C.paper2}, #fff)`, border: `1.5px solid ${C.brass}`, boxShadow: "inset 0 1px 2px rgba(255,255,255,.7)" }}>
                        <Icon size={27} color={C.oxblood} />
                      </div>
                      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 18, color: C.ink }}>{label}</div>
                      <div style={{ fontSize: 10.5, color: count ? C.brassDeep : C.inkSoft, fontWeight: count ? 700 : 500, lineHeight: 1.3, textTransform: count ? "uppercase" : "none", letterSpacing: count ? ".04em" : 0 }}>
                        {count ? `${count} cut${count > 1 ? "s" : ""}` : blurb}
                      </div>
                    </button>
                  );
                })}
              </div>
              <p style={{ textAlign: "center", color: C.inkSoft, fontSize: 12, marginTop: 14, marginBottom: 0 }}>
                Set which cuts appear for each protein in <b style={{ color: C.oxblood }}>Tune</b>.
              </p>
            </div>
          )}

          {step === "cut" && animal && (() => {
            const rotation = (prefs.preferredCuts || []).filter((p) => p.animal === animal).map((p) => p.cut);
            const cutList = rotation.length ? rotation : CUTS[animal].primals.flatMap((p) => p.cuts);
            const usingFallback = rotation.length === 0;
            return (
              <div key={"cut-" + animal} className="pane-in">
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                  <button
                    className="hk-btn"
                    onClick={() => { setStep("protein"); setCut(null); }}
                    style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "7px 12px 7px 8px", cursor: "pointer", borderRadius: 999, border: `1.5px solid ${C.line}`, background: "#fff", color: C.oxblood, fontWeight: 700, fontSize: 13.5 }}
                  >
                    <ChevronLeft size={16} /> Protein
                  </button>
                  <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 21, margin: 0 }}>
                    {CUTS[animal].label} &middot; choose a cut
                  </h2>
                </div>

                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {cutList.map((cName) => {
                    const active = cut === cName;
                    return (
                      <button
                        key={cName}
                        className="hk-chip"
                        onClick={() => setCut(cName)}
                        style={{
                          padding: "9px 14px", cursor: "pointer", borderRadius: 999,
                          border: `1.5px solid ${active ? C.brass : C.line}`,
                          background: active ? C.brass : C.card, color: active ? "#fff" : C.ink,
                          fontWeight: active ? 700 : 500, fontSize: 14,
                          boxShadow: active ? "0 4px 12px rgba(168,95,52,.28)" : "none",
                        }}
                      >
                        {cName}
                      </button>
                    );
                  })}
                </div>

                {usingFallback && (
                  <p style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 12, marginBottom: 0 }}>
                    Showing all {CUTS[animal].label.toLowerCase()} cuts. Pick your regulars in <b style={{ color: C.oxblood }}>Tune</b> to shorten this list.
                  </p>
                )}

                {(() => {
                  const have = [...(prefs.haveVeggies || []), ...(prefs.haveProteinsList || []), ...(prefs.spicesOut || [])].length + ((prefs.haveProteins || "").trim() ? 1 : 0) + ((prefs.pantryExtra || "").trim() ? 1 : 0);
                  if (!have) return null;
                  return (
                    <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderRadius: 10, background: "#f1ead9", border: `1px solid ${C.line}`, fontSize: 12.5, color: C.inkSoft }}>
                      <Salad size={15} color={C.sage} />
                      {prefs.pantryStrict ? "Suggesting only what you can make from what's on hand." : "Leaning recipes toward what you have on hand."}
                      <button className="hk-btn" onClick={() => setShowPantry(true)} style={{ marginLeft: "auto", background: "none", border: "none", color: C.oxblood, fontWeight: 700, fontSize: 12.5, cursor: "pointer", padding: 0 }}>Edit</button>
                    </div>
                  );
                })()}

                <button
                  className="hk-btn"
                  onClick={() => savePrefs({ ...prefs, webGrounded: !prefs.webGrounded })}
                  style={{
                    marginTop: 12, width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "11px 14px",
                    cursor: "pointer", borderRadius: 12, textAlign: "left",
                    border: `1.5px solid ${prefs.webGrounded ? C.oxblood : C.line}`,
                    background: prefs.webGrounded ? "#f8e6d4" : "#fff",
                  }}
                >
                  <Globe size={18} color={prefs.webGrounded ? C.oxblood : C.inkSoft} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>Cite real sources</div>
                    <div style={{ fontSize: 12, color: C.inkSoft }}>Pull from highly-rated published recipes with links. Slower.</div>
                  </div>
                  <span style={{ width: 42, height: 24, borderRadius: 999, background: prefs.webGrounded ? C.oxblood : C.line, position: "relative", transition: "background .2s", flexShrink: 0 }}>
                    <span style={{ position: "absolute", top: 3, left: prefs.webGrounded ? 21 : 3, width: 18, height: 18, borderRadius: 999, background: "#fff", transition: "left .2s" }} />
                  </span>
                </button>

                <button
                  className={cut && !loading ? "hk-btn hk-cta" : ""}
                  onClick={run}
                  disabled={!cut || loading}
                  style={{
                    marginTop: 12, width: "100%", padding: "16px", cursor: cut && !loading ? "pointer" : "not-allowed",
                    borderRadius: 14, border: "none",
                    background: cut ? `linear-gradient(180deg, ${C.oxblood}, ${C.oxbloodDeep})` : C.line,
                    color: cut ? "#fff" : C.inkSoft,
                    fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 18, letterSpacing: ".4px",
                    display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
                    boxShadow: cut ? "0 10px 24px rgba(114,60,31,.30)" : "none", opacity: loading ? 0.85 : 1,
                  }}
                >
                  {loading ? <Loader2 size={20} style={{ animation: "spin 1s linear infinite" }} /> : prefs.webGrounded ? <Globe size={20} /> : <Sparkles size={20} />}
                  {loading
                    ? (prefs.webGrounded ? "Researching highly-rated recipes…" : "Consulting the kitchen…")
                    : cut
                    ? (prefs.webGrounded ? `Find 3 vetted, sourced recipes` : `Find my top 3 for ${cut}`)
                    : "Pick a cut to begin"}
                </button>
              </div>
            );
          })()}
        </section>

        {/* Error */}
        {error && (
          <div className="rise" style={{ ...panel(), borderColor: C.oxblood, background: "#f8e6d4", marginTop: 18 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
              <X size={18} color={C.oxblood} style={{ marginTop: 2 }} />
              <div>
                <div style={{ fontWeight: 700, color: C.oxbloodDeep }}>{error}</div>
                <button onClick={run} style={textBtn()}>Try again</button>
              </div>
            </div>
          </div>
        )}

        {/* Loading skeleton */}
        {loading && <LoadingBlock cut={resultCut} grounded={groundingNow} />}

        {/* Results */}
        {recipes && !loading && (
          <section style={{ marginTop: 22 }}>
            <SectionTitle n="02" text={`Top 3 for ${resultCut}`} />
            {notice && (
              <div style={{ marginBottom: 12, padding: "9px 12px", borderRadius: 10, background: "#f6eddc", border: `1px solid ${C.line}`, color: C.inkSoft, fontSize: 13 }}>
                {notice}
              </div>
            )}
            <div style={{ display: "grid", gap: 16 }}>
              {recipes.map((r, i) => (
                <RecipeCard
                  key={(r.title || "r") + ":" + i}
                  r={r}
                  index={i}
                  animal={r.animal || resultAnimal || "beef"}
                  open={open === i}
                  onToggle={() => setOpen(open === i ? -1 : i)}
                  faved={favorites.some((f) => f.title === r.title)}
                  onFav={() => toggleFav(r)}
                  onPrint={() => printIt(r)}
                  onAddToPlan={(rec) => setPlanTarget(rec)}
                />
              ))}
            </div>
          </section>
        )}
      </main>

      {showPrefs && <PrefsModal prefs={prefs} onSave={savePrefs} onClose={() => setShowPrefs(false)} ready={ready} storageOk={storageOk} />}
      {showFavs && (
        <FavsModal
          favorites={favorites}
          customCategories={prefs.categories || []}
          onClose={() => setShowFavs(false)}
          onClear={async () => { setFavorites([]); await storageSet(FAVS_KEY, []); }}
          onToggleFav={toggleFav}
          onPrint={printIt}
          onSetCategory={setFavoriteCategory}
          onAddCategory={addCategory}
          onExport={exportFavorites}
          onImport={importRecipePhoto}
          importing={importing}
          importError={importError}
          onAddToPlan={(rec) => setPlanTarget(rec)}
        />
      )}
      {printData && <PrintOverlay data={printData} onClose={() => setPrintData(null)} />}
      {showPantry && <PantryModal prefs={prefs} onChange={updatePantry} onClose={() => setShowPantry(false)} />}
      {showPlanner && (
        <PlannerModal
          plan={plan}
          prefs={prefs}
          favorites={favorites}
          onClose={() => setShowPlanner(false)}
          onAdd={addToPlan}
          onAddMany={addManyToPlan}
          onRemove={removeFromPlan}
          onClear={clearPlan}
          onOpenTune={() => { setShowPlanner(false); setShowPrefs(true); }}
        />
      )}
      {planTarget && (
        <DayPickerModal
          recipe={planTarget}
          plan={plan}
          onPick={(iso) => { addToPlan(iso, planTarget); setPlanTarget(null); setShowPlanner(true); }}
          onClose={() => setPlanTarget(null)}
        />
      )}
    </div>
  );
}

// --- Sub-components -----------------------------------------------------------
function panel() {
  return { background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18, boxShadow: "0 2px 14px rgba(36,28,23,.05)" };
}
function textBtn() {
  return { marginTop: 8, background: "none", border: "none", color: C.oxblood, fontWeight: 700, cursor: "pointer", textDecoration: "underline", padding: 0, fontSize: 14 };
}

// Pick which day to slot a recipe into.
function DayPickerModal({ recipe, plan, onPick, onClose }) {
  const days = planDays(7);
  return (
    <Shell onClose={onClose} title="Add to which day?">
      <p style={{ marginTop: 0, fontSize: 13.5, color: C.inkSoft }}>Planning <b style={{ color: C.oxblood }}>{recipe.title}</b> — pick a day:</p>
      <div style={{ display: "grid", gap: 8 }}>
        {days.map((iso) => {
          const taken = plan[iso];
          return (
            <button key={iso} className="hk-btn" onClick={() => onPick(iso)} style={{ display: "flex", alignItems: "center", gap: 11, padding: "12px 14px", borderRadius: 12, border: `1.5px solid ${C.line}`, background: "#fff", cursor: "pointer", textAlign: "left" }}>
              <CalendarDays size={17} color={C.oxblood} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 14.5, color: C.ink }}>{dayLabel(iso)}</div>
                {taken && <div style={{ fontSize: 12, color: C.inkSoft, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Currently: {taken.title}</div>}
              </div>
              {taken && <span style={{ fontSize: 11, fontWeight: 800, color: C.brassDeep }}>replace</span>}
            </button>
          );
        })}
      </div>
    </Shell>
  );
}

// The meal-planning hub: week view, grocery list, reminders, send to Heather.
function PlannerModal({ plan, prefs, favorites, onClose, onAdd, onAddMany, onRemove, onClear, onOpenTune }) {
  const [view, setView] = useState("week");
  const [pickDay, setPickDay] = useState(null);
  const [groc, setGroc] = useState(null);
  const [grocLoading, setGrocLoading] = useState(false);
  const [grocErr, setGrocErr] = useState("");
  const [checked, setChecked] = useState({});
  const [copied, setCopied] = useState(false);
  const [planning, setPlanning] = useState(false);
  const [planErr, setPlanErr] = useState("");

  const days = planDays(7);
  const planned = days.filter((d) => plan[d]).map((d) => plan[d]);
  const hasContact = !!((prefs.heatherEmail || "").trim() || (prefs.heatherPhone || "").trim());
  const today = isoDate(new Date());
  const emptyDays = days.filter((d) => !plan[d]);

  const planWeek = async () => {
    if (!emptyDays.length) { setPlanErr("Your week is full — remove a day to regenerate it."); return; }
    setPlanning(true); setPlanErr("");
    try {
      const key = (prefs.anthropicKey && prefs.anthropicKey.trim()) || ANTHROPIC_API_KEY;
      const recs = await fetchRecipes(buildWeekPrompt({ prefs, favorites, ctx: dayContext(), count: emptyDays.length }), key);
      const entries = emptyDays.map((iso, i) => (recs[i] ? { iso, recipe: recs[i] } : null)).filter(Boolean);
      if (!entries.length) throw new Error("No meals came back — try again.");
      await onAddMany(entries);
    } catch (e) { setPlanErr(e.message || "Couldn't plan the week."); }
    finally { setPlanning(false); }
  };

  const buildList = async () => {
    setGrocLoading(true); setGrocErr(""); setGroc(null);
    try {
      const key = (prefs.anthropicKey && prefs.anthropicKey.trim()) || ANTHROPIC_API_KEY;
      const cats = await fetchGroceryList(planned, prefs, key);
      setGroc(cats); setChecked({}); setView("grocery");
    } catch (e) { setGrocErr(e.message || "Couldn't build the list."); }
    finally { setGrocLoading(false); }
  };
  const copyList = () => {
    if (!groc) return;
    const text = "Grocery list — Heather's Kitchen\n\n" + groc.map((c) => `${c.name}\n` + c.items.map((it) => `- ${it.qty ? it.qty + " " : ""}${it.item}`).join("\n")).join("\n\n");
    try { if (navigator.clipboard) { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); } } catch (e) {}
  };
  const macroTag = (r) => (r.nutrition && r.nutrition.protein ? `${r.nutrition.protein}g protein · ${r.nutrition.calories} cal` : "");

  if (view === "grocery") {
    return (
      <Shell onClose={onClose} title="Grocery list">

function hashStr(s) {
  let h = 0;
  const str = String(s || "");
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}

function DishImage({ r, animal }) {
  const hasPhoto = typeof r.photo === "string" && r.photo.length > 0;
  const a = animal || r.animal || "other";
  const theme = PROTEIN_THEME[a] || PROTEIN_THEME.other;
  const Icon = a === "pork" ? Ham : a === "chicken" ? Drumstick : a === "beef" ? Beef : ChefHat;
  const vetted = !!(r.source && (r.source.url || r.source.name));
  const [loaded, setLoaded] = useState(false);
  const [pexImg, setPexImg] = useState("");
  const [exactFailed, setExactFailed] = useState(false);
  const [pexFailed, setPexFailed] = useState(false);
  const [genFailed, setGenFailed] = useState(false);

  // Generated image of THIS dish (keyless last resort before the banner).
  const veg = (r.veggiePairing || []).map((v) => v && v.veg).filter(Boolean).slice(0, 2).join(" and ");
  const desc = [r.imageQuery || r.title, veg ? `with ${veg}` : "", "appetizing food photography, plated, natural light, shallow depth of field"].filter(Boolean).join(", ");
  const seed = hashStr((r.title || "dish") + a) % 100000;
  const genUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(desc)}?width=640&height=320&nologo=true&seed=${seed}&model=flux`;

  // EXACT source photo, via the user's image proxy/Worker (defeats hotlinking).
  // Prefer a direct image URL the search returned, else the source page (the
  // Worker extracts its og:image). Only for vetted recipes.
  const exactTarget = (r.source && (r.source.imageUrl || r.source.url)) || "";
  const exactUrl = IMG_CFG.proxy && exactTarget
    ? `${IMG_CFG.proxy}${IMG_CFG.proxy.includes("?") ? "&" : "?"}url=${encodeURIComponent(exactTarget)}`
    : "";

  // Reliable real food photo from Pexels (matched to the dish name).
  useEffect(() => {
    if (hasPhoto || !IMG_CFG.pexels) return;
    const q = (r.imageQuery || r.title || "").trim();
    if (!q) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch(`https://api.pexels.com/v1/search?per_page=1&orientation=landscape&query=${encodeURIComponent(q + " plated dish")}`, { headers: { Authorization: IMG_CFG.pexels } });
        const data = await res.json();
        const p = data && data.photos && data.photos[0];
        const url = p && p.src && (p.src.large || p.src.medium || p.src.original);
        if (url && !cancelled) setPexImg(url);
      } catch (e) {}
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [r.title]);

  const usingExact = !hasPhoto && !!exactUrl && !exactFailed;
  const usingPex = !hasPhoto && !usingExact && !!pexImg && !pexFailed;
  const usingGen = !hasPhoto && !usingExact && !usingPex && !genFailed;
  const imgSrc = hasPhoto ? r.photo : usingExact ? exactUrl : usingPex ? pexImg : usingGen ? genUrl : "";
  const badgeKind = hasPhoto ? "Your photo" : usingExact ? "Source photo" : usingPex ? "Photo" : usingGen ? "AI image" : "";

  return (
    <div style={{ position: "relative", height: 150, overflow: "hidden", background: `linear-gradient(135deg, ${theme[0]}, ${theme[1]})` }}>
      {/* base banner — shows instantly while the image loads, and stays if it fails */}
      <div style={{ position: "absolute", inset: 0, background: "radial-gradient(120% 90% at 12% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 55%)" }} />
      <Icon size={150} color="rgba(255,255,255,0.13)" strokeWidth={1.5} style={{ position: "absolute", right: -16, bottom: -26 }} />

      {/* the dish image, fading in over the banner */}
      {imgSrc ? (
        <img
          key={imgSrc}
          src={imgSrc}
          alt={r.title}
          loading="lazy"
          referrerPolicy="no-referrer"
          onLoad={() => setLoaded(true)}
          onError={() => { setLoaded(false); if (usingExact) setExactFailed(true); else if (usingPex) setPexFailed(true); else if (usingGen) setGenFailed(true); }}
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", opacity: loaded ? 1 : 0, transition: "opacity .4s ease" }}
        />
      ) : null}

      {/* overlays — always on top of whichever layer is showing */}
      {vetted ? (
        <div style={{ position: "absolute", left: 12, top: 12, display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,.92)", color: C.oxbloodDeep, borderRadius: 999, padding: "4px 10px", fontSize: 11.5, fontWeight: 800 }}>
          <Check size={13} /> Vetted{r.source && r.source.name ? ` · ${r.source.name}` : ""}
        </div>
      ) : (
        <div style={{ position: "absolute", left: 12, top: 12, display: "inline-flex", alignItems: "center", gap: 5, color: "#fff", fontSize: 10.5, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase", textShadow: "0 1px 4px rgba(0,0,0,.4)" }}>
          {hasPhoto ? "Your photo" : badgeKind}
        </div>
      )}
      {r.source && typeof r.source.rating === "number" && r.source.rating > 0 ? (
        <span style={{ position: "absolute", right: 12, top: 12, display: "inline-flex", alignItems: "center", gap: 4, background: "rgba(58,40,32,.5)", color: "#fff", borderRadius: 999, padding: "3px 9px", fontSize: 11.5, fontWeight: 700 }}>
          <Star size={12} fill="#fff" /> {r.source.rating.toFixed(1)}{r.source.reviewCount ? ` (${r.source.reviewCount})` : ""}
        </span>
      ) : null}
      {r.nutrition && r.nutrition.protein ? (
        <span style={{ position: "absolute", right: 12, bottom: 12, display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(255,255,255,.92)", color: C.oxbloodDeep, borderRadius: 999, padding: "4px 10px", fontSize: 12.5, fontWeight: 800 }}>
          <Drumstick size={13} /> {r.nutrition.protein}g
        </span>
      ) : null}
    </div>
  );
}

// --- Ingredient scaling --------------------------------------------------------
function fmtQty(n) {
  if (!isFinite(n) || n <= 0) return "";
  const whole = Math.floor(n + 1e-6);
  const frac = n - whole;
  const map = [[0, ""], [0.125, "1/8"], [0.25, "1/4"], [0.333, "1/3"], [0.5, "1/2"], [0.666, "2/3"], [0.75, "3/4"], [0.875, "7/8"], [1, ""]];
  let best = map[0], bd = Infinity;
  map.forEach((m) => { const d = Math.abs(frac - m[0]); if (d < bd) { bd = d; best = m; } });
  let w = whole, fr = best[1];
  if (best[0] === 1) { w += 1; fr = ""; }
  if (w === 0 && fr === "") return (Math.round(n * 100) / 100).toString();
  if (w === 0) return fr;
  return fr ? `${w} ${fr}` : `${w}`;
}
function parseLeadingQty(s) {
  let m = s.match(/^\s*(\d+)\s+(\d+)\/(\d+)\s+/);
  if (m) return { value: parseInt(m[1], 10) + parseInt(m[2], 10) / parseInt(m[3], 10), rest: s.slice(m[0].length) };
  m = s.match(/^\s*(\d+)\/(\d+)\s+/);
  if (m) return { value: parseInt(m[1], 10) / parseInt(m[2], 10), rest: s.slice(m[0].length) };
  m = s.match(/^\s*(\d+(?:\.\d+)?)\s+/);
  if (m) return { value: parseFloat(m[1]), rest: s.slice(m[0].length) };
  return null;
}
// Scale one ingredient line; lines with no leading number are untouched.
function scaleIngredient(ingStr, currentServings, defaultServings) {
  if (!ingStr || !defaultServings || currentServings === defaultServings) return ingStr;
  const p = parseLeadingQty(ingStr);
  if (!p) return ingStr;
  const scaled = p.value * (currentServings / defaultServings);
  const out = fmtQty(scaled);
  if (!out) return ingStr;
  return `${out} ${p.rest}`;
}
// First time mention in a step → seconds (smart timer).
function parseStepSeconds(text) {
  if (!text) return 0;
  const m = String(text).match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/i);
  if (!m) return 0;
  const v = parseFloat(m[1]); const u = m[2].toLowerCase();
  if (u.startsWith("h")) return Math.round(v * 3600);
  if (u.startsWith("m")) return Math.round(v * 60);
  return Math.round(v);
}
function fmtClock(sec) {
  const s = Math.max(0, Math.round(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
}

// --- Hands-free interactive cook mode ------------------------------------------
function InteractiveCookMode({ r, onClose }) {
  const steps = r.steps && r.steps.length ? r.steps : ["No steps provided for this recipe."];
  const [step, setStep] = useState(0);
  const [listening, setListening] = useState(false);
  const [remaining, setRemaining] = useState(parseStepSeconds(steps[0]));
  const [running, setRunning] = useState(false);
  const [status, setStatus] = useState("");

  const ttsOk = typeof window !== "undefined" && "speechSynthesis" in window;
  const SR = typeof window !== "undefined" ? window.SpeechRecognition || window.webkitSpeechRecognition : null;
  const recogRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const tickRef = React.useRef(null);
  const stepRef = React.useRef(0);
  stepRef.current = step;

  const stepSeconds = parseStepSeconds(steps[step]);

  const speak = (text) => {
    if (!ttsOk || !text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.96; u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };
  const chime = () => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = audioRef.current || (audioRef.current = new Ctx());
      const beep = (t, freq) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.4, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        osc.start(t); osc.stop(t + 0.45);
      };
      const now = ctx.currentTime;
      beep(now, 880); beep(now + 0.5, 1175);
    } catch (e) {}
  };

  // Narrate when the step changes; reset its timer.
  useEffect(() => {
    setRemaining(parseStepSeconds(steps[step]));
    setRunning(false);
    speak(`Step ${step + 1}. ${steps[step]}`);
    return () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} };
    // eslint-disable-next-line
  }, [step]);

  // Countdown.
  useEffect(() => {
    if (!running) { if (tickRef.current) clearInterval(tickRef.current); return; }
    tickRef.current = setInterval(() => {
      setRemaining((s) => {
        if (s <= 1) {
          clearInterval(tickRef.current);
          setRunning(false);
          chime();
          speak("Timer complete.");
          setStatus("Timer complete");
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => { if (tickRef.current) clearInterval(tickRef.current); };
    // eslint-disable-next-line
  }, [running]);

  const goNext = () => setStep((s) => Math.min(steps.length - 1, s + 1));
  const goPrev = () => setStep((s) => Math.max(0, s - 1));
  const startTimer = () => { if (parseStepSeconds(steps[stepRef.current]) > 0) { setRunning(true); setStatus("Timer running"); } };
  const pauseTimer = () => { setRunning(false); setStatus("Timer paused"); };

  const handleCommand = (raw) => {
    const t = raw.toLowerCase();
    if (/\bnext\b/.test(t)) { setStatus('Heard: "next"'); goNext(); }
    else if (/\b(back|previous)\b/.test(t)) { setStatus('Heard: "back"'); goPrev(); }
    else if (/\b(read|repeat)\b/.test(t)) { setStatus('Heard: "read"'); speak(`Step ${stepRef.current + 1}. ${steps[stepRef.current]}`); }
    else if (/start timer/.test(t)) { setStatus('Heard: "start timer"'); startTimer(); }
    else if (/\b(pause|stop)\b/.test(t)) { setStatus('Heard: "pause"'); pauseTimer(); }
  };

  // Speech-recognition lifecycle.
  useEffect(() => {
    if (!listening || !SR) return;
    let stopped = false;
    const rec = new SR();
    recogRef.current = rec;
    rec.continuous = true; rec.interimResults = false; rec.lang = "en-US";
    rec.onresult = (e) => {
      const res = e.results[e.results.length - 1];
      if (res && res[0]) handleCommand(res[0].transcript);
    };
    rec.onerror = (e) => { if (e && e.error === "not-allowed") { setStatus("Microphone blocked — use the buttons."); setListening(false); } };
    rec.onend = () => { if (!stopped && listening) { try { rec.start(); } catch (e) {} } };
    try { rec.start(); setStatus("Listening — say next, back, read, start timer, or pause."); } catch (e) {}
    return () => { stopped = true; try { rec.onend = null; rec.stop(); } catch (e) {} };
    // eslint-disable-next-line
  }, [listening]);

  useEffect(() => () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }, []);

  const bigBtn = (bg, color, brd) => ({ flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "16px 12px", borderRadius: 14, border: brd || "none", background: bg, color, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 17, cursor: "pointer" });

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 90, background: C.ink, color: C.paper, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "16px 18px", borderBottom: "1px solid rgba(255,255,255,.12)" }}>
        <ChefHat size={20} color={C.brass} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 17, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.title}</div>
          <div style={{ fontSize: 12, opacity: 0.7 }}>Hands-free cook mode</div>
        </div>
        <button onClick={onClose} aria-label="Exit cook mode" style={{ width: 42, height: 42, borderRadius: 999, border: "1.5px solid rgba(255,255,255,.3)", background: "transparent", color: C.paper, cursor: "pointer", display: "grid", placeItems: "center" }}>
          <X size={20} />
        </button>
      </div>

      <div style={{ flex: 1, overflow: "auto", padding: "24px 22px", display: "flex", flexDirection: "column" }}>
        <div style={{ fontSize: 13, letterSpacing: ".18em", textTransform: "uppercase", color: C.brass, fontWeight: 800 }}>Step {step + 1} of {steps.length}</div>
        <div style={{ height: 6, background: "rgba(255,255,255,.14)", borderRadius: 999, margin: "12px 0 22px", overflow: "hidden" }}>
          <div style={{ width: `${((step + 1) / steps.length) * 100}%`, height: "100%", background: `linear-gradient(90deg, ${C.brass}, ${C.brassDeep})`, transition: "width .3s ease" }} />
        </div>
        <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 27, lineHeight: 1.4 }}>{steps[step]}</div>

        {stepSeconds > 0 && (
          <div style={{ marginTop: 26, background: "rgba(255,255,255,.06)", border: "1px solid rgba(255,255,255,.16)", borderRadius: 18, padding: "20px", textAlign: "center" }}>
            <div style={{ fontSize: 12, letterSpacing: ".16em", textTransform: "uppercase", color: C.brass, fontWeight: 800 }}>Timer</div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 56, lineHeight: 1.05, margin: "6px 0 14px", color: remaining === 0 ? C.brass : C.paper }}>{fmtClock(remaining)}</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              {!running ? (
                <button onClick={() => { if (remaining === 0) setRemaining(stepSeconds); setRunning(true); }} style={{ ...bigBtn(C.brass, "#3a2820"), flex: "0 0 auto", padding: "12px 24px" }}>▶ {remaining === 0 ? "Restart" : "Start"}</button>
              ) : (
                <button onClick={pauseTimer} style={{ ...bigBtn("transparent", C.paper, `1.5px solid ${C.brass}`), flex: "0 0 auto", padding: "12px 24px" }}>⏸ Pause</button>
              )}
            </div>
          </div>
        )}
      </div>

      <div style={{ padding: "14px 18px calc(18px + env(safe-area-inset-bottom))", borderTop: "1px solid rgba(255,255,255,.12)", background: "rgba(0,0,0,.15)" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={goPrev} disabled={step === 0} style={{ ...bigBtn("transparent", C.paper, "1.5px solid rgba(255,255,255,.3)"), opacity: step === 0 ? 0.4 : 1 }}><ChevronLeft size={18} /> Back</button>
          {ttsOk && <button onClick={() => speak(`Step ${step + 1}. ${steps[step]}`)} style={bigBtn("transparent", C.paper, "1.5px solid rgba(255,255,255,.3)")}>🔊 Read</button>}
          <button onClick={goNext} disabled={step === steps.length - 1} style={{ ...bigBtn(`linear-gradient(180deg, ${C.brass}, ${C.brassDeep})`, "#3a2820"), opacity: step === steps.length - 1 ? 0.5 : 1 }}>Next <ChevronDown size={18} style={{ transform: "rotate(-90deg)" }} /></button>
        </div>
        {SR ? (
          <button onClick={() => setListening((v) => !v)} style={{ marginTop: 10, width: "100%", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 9, padding: "12px", borderRadius: 12, border: `1.5px solid ${listening ? C.brass : "rgba(255,255,255,.3)"}`, background: listening ? "rgba(200,149,76,.18)" : "transparent", color: C.paper, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
            <span style={{ width: 9, height: 9, borderRadius: 999, background: listening ? "#7CFC8A" : "rgba(255,255,255,.4)", boxShadow: listening ? "0 0 8px #7CFC8A" : "none" }} />
            {listening ? "Listening — tap to stop" : "Turn on voice commands"}
          </button>
        ) : (
          <div style={{ marginTop: 10, fontSize: 12.5, textAlign: "center", opacity: 0.7 }}>Voice commands aren&rsquo;t supported in this browser — use the buttons above.</div>
        )}
        <div style={{ marginTop: 8, fontSize: 12, textAlign: "center", opacity: 0.7, minHeight: 16 }}>
          {status || (SR ? "Say: next · back · read · start timer · pause" : "")}
        </div>
      </div>
    </div>
  );
}

                    <input type="range" min={1} max={24} value={currentServings} onChange={(e) => setCurrentServings(parseInt(e.target.value, 10))} style={{ flex: 1, minWidth: 120, accentColor: C.oxblood }} />

                      <button onClick={() => setCurrentServings(defaultServings)} style={{ background: "none", border: "none", color: C.oxblood, fontWeight: 700, fontSize: 12.5, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Reset</button>
                    )}
                  </div>
                  <ul style={{ margin: "8px 0 0", paddingLeft: 18, lineHeight: 1.7 }}>
                    {r.ingredients.map((x, i) => <li key={i}>{scaleIngredient(x, currentServings, defaultServings)}</li>)}
                  </ul>
                  {currentServings !== defaultServings && (
                    <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 6, fontStyle: "italic" }}>Scaled from {defaultServings} servings — round to taste.</div>
                  )}
                </div>
              )}
              {r.steps.length > 0 && (
                <div>
                  <Label icon={<Flame size={15} />} text="Method" />
                  <ol style={{ margin: "8px 0 0", paddingLeft: 20, lineHeight: 1.7 }}>
                    {r.steps.map((x, i) => <li key={i} style={{ marginBottom: 6 }}>{x}</li>)}
                  </ol>
                </div>
              )}
            </div>

            {r.proTips.length > 0 && (
              <div style={{ marginTop: 16 }}>
                <Label icon={<Sparkles size={15} />} text="Pro tips" />
                <ul style={{ margin: "8px 0 0", paddingLeft: 18, lineHeight: 1.7, color: C.brassDeep }}>
                  {r.proTips.map((x, i) => <li key={i}>{x}</li>)}
                </ul>
              </div>
            )}
          </div>
        )}
      </div>
      {activeCookMode && <InteractiveCookMode r={r} onClose={() => setActiveCookMode(false)} />}
    </article>
  );
}
function Meta({ icon, text }) {
  if (!text) return null;
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>{icon}{text}</span>;
}
function Macro({ label, value }) {
  return (
    <div style={{ flex: "1 1 70px", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px" }}>
      <div style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: C.inkSoft, fontWeight: 700 }}>{label}</div>
      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 18, color: C.ink, lineHeight: 1.05 }}>{value}</div>
    </div>
  );
}
function Label({ icon, text }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15, color: C.oxbloodDeep }}>{icon}{text}</div>;
}
function Callout({ icon, title, body, tint }) {
  return (
    <div style={{ display: "flex", gap: 10, padding: "10px 12px", borderRadius: 10, background: tint, marginTop: 10 }}>
      <span style={{ color: C.oxblood, marginTop: 2 }}>{icon}</span>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</div>
        <div style={{ fontSize: 13.5, color: C.inkSoft }}>{body}</div>
      </div>

}

// --- Modals -------------------------------------------------------------------
function Shell({ children, onClose, title }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(36,28,23,.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50, boxSizing: "border-box" }}>
      <div onClick={(e) => e.stopPropagation()} className="rise" style={{ background: C.paper, borderRadius: 18, maxWidth: 620, width: "100%", minWidth: 0, maxHeight: "88vh", overflowY: "auto", overflowX: "hidden", boxSizing: "border-box", border: `2px solid ${C.brass}`, boxShadow: "0 20px 60px rgba(0,0,0,.4)" }}>
        <div style={{ position: "sticky", top: 0, background: `linear-gradient(180deg, ${C.oxbloodDeep}, ${C.oxblood})`, color: C.paper, padding: "14px 20px", display: "flex", alignItems: "center", borderBottom: `2px solid ${C.brass}` }}>
          <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 20, margin: 0 }}>{title}</h2>
          <button onClick={onClose} style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: C.paper }}><X size={22} /></button>
        </div>
        <div style={{ padding: 20 }}>{children}</div>
      </div>
    </div>
  );
}

function MultiChips({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 8 }}>
      {options.map((o) => {
        const on = value.includes(o);
        return (
          <button
            key={o}
            onClick={() => onChange(on ? value.filter((v) => v !== o) : [...value, o])}
            style={{ padding: "6px 12px", cursor: "pointer", borderRadius: 999, border: `1.5px solid ${on ? C.oxblood : C.line}`, background: on ? C.oxblood : "#fff", color: on ? "#fff" : C.ink, fontSize: 13.5, fontWeight: on ? 700 : 500 }}
          >
            {o}
          </button>
        );
      })}
    </div>
  );
}
function SingleChips({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 8 }}>
      {options.map((o) => {
        const on = value === o;
        return (
          <button key={o} onClick={() => onChange(o)} style={{ padding: "6px 12px", cursor: "pointer", borderRadius: 999, border: `1.5px solid ${on ? C.brass : C.line}`, background: on ? C.brass : "#fff", color: on ? "#fff" : C.ink, fontSize: 13.5, fontWeight: on ? 700 : 500 }}>{o}</button>
        );
      })}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15, color: C.oxbloodDeep }}>{label}</div>
      {children}
    </div>
  );
}

function TimeChips({ value, onChange, options = TIME_OPTIONS }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 8 }}>
      {options.map((o) => {
        const on = value === o.v || (o.v === 0 && (value == null || value === 0));
        return (
          <button key={o.v} className="hk-chip" onClick={() => onChange(o.v)} style={{ padding: "6px 14px", cursor: "pointer", borderRadius: 999, border: `1.5px solid ${on ? C.brass : C.line}`, background: on ? C.brass : "#fff", color: on ? "#fff" : C.ink, fontSize: 13.5, fontWeight: on ? 700 : 500 }}>{o.label}</button>
        );
      })}
    </div>
  );
}

function CutSelector({ value, onChange }) {
  const isOn = (animal, cut) => value.some((p) => p.animal === animal && p.cut === cut);
  const toggle = (animal, cut) => {
    onChange(isOn(animal, cut)
      ? value.filter((p) => !(p.animal === animal && p.cut === cut))
      : [...value, { animal, cut }]);
  };
  return (
    <div style={{ marginTop: 8 }}>
      {ANIMAL_KEYS.map((a) => (
        <div key={a} style={{ marginBottom: 12 }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 14, color: C.oxblood, marginBottom: 6 }}>{CUTS[a].label}</div>
          {CUTS[a].primals.map((p) => (
            <div key={p.name} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10.5, letterSpacing: ".14em", textTransform: "uppercase", color: C.inkSoft, marginBottom: 5, fontWeight: 700 }}>{p.name}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {p.cuts.map((cName) => {
                  const on = isOn(a, cName);
                  return (
                    <button key={cName} onClick={() => toggle(a, cName)} style={{ padding: "5px 11px", cursor: "pointer", borderRadius: 999, border: `1.5px solid ${on ? C.oxblood : C.line}`, background: on ? C.oxblood : "#fff", color: on ? "#fff" : C.ink, fontSize: 12.5, fontWeight: on ? 700 : 500 }}>{cName}</button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function PrefSection({ title, hint, first }) {

    <div style={{ margin: first ? "4px 0 12px" : "24px 0 12px", paddingTop: first ? 0 : 18, borderTop: first ? "none" : `1px solid ${C.line}` }}>
      <div style={{ fontSize: 12.5, letterSpacing: ".13em", textTransform: "uppercase", fontWeight: 800, color: C.brassDeep }}>{title}</div>
      {hint && <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 4, lineHeight: 1.45 }}>{hint}</div>}
    </div>
  );
}

        <input
          type="text"
          value={draft.imgProxy || ""}
          onChange={(e) => up("imgProxy", e.target.value.trim())}
          placeholder="https://recipe-img.your-name.workers.dev"
          autoComplete="off"
          spellCheck={false}
          style={input}
        />
      </Field>
      <Field label="Backup food photos — Pexels API key (optional)">
        <div style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.45 }}>
          When there&rsquo;s no exact source photo (or for AI-built recipes), this fetches a real, high-quality photo of the dish. Free key, used only by your browser.
        </div>
        <input
          type="password"
          value={draft.pexelsKey || ""}
          onChange={(e) => up("pexelsKey", e.target.value.trim())}
          placeholder="Pexels API key"
          autoComplete="off"
          style={input}
        />
        <a href="https://www.pexels.com/api/" target="_blank" rel="noopener noreferrer" style={{ fontSize: 12.5, color: C.oxblood, fontWeight: 700, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 4, marginTop: 6 }}>
          Get a free Pexels key <ExternalLink size={12} />
        </a>
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 8, lineHeight: 1.4 }}>
          Priority: your imported photo → exact source photo → Pexels photo → generated image → color banner. Each falls back automatically.
        </div>
      </Field>

      <button onClick={save} disabled={saving} style={{ width: "100%", marginTop: 6, padding: 14, cursor: saving ? "default" : "pointer", borderRadius: 12, border: "none", background: saved ? C.brassDeep : `linear-gradient(180deg, ${C.oxblood}, ${C.oxbloodDeep})`, color: C.paper, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {saved ? <><Check size={18} /> Saved</> : saving ? "Saving…" : "Save settings"}
      </button>
    </Shell>
  );
}

const PRESET_CATEGORIES = ["Beef", "Pork", "Chicken", "Holiday", "Quick", "To Try", "Imported"];
function FavsModal({ favorites, customCategories, onClose, onClear, onToggleFav, onPrint, onSetCategory, onAddCategory, onExport, onImport, importing, importError, onAddToPlan }) {
  const [openIdx, setOpenIdx] = useState(-1);
  const [filter, setFilter] = useState("All");
  const [newCat, setNewCat] = useState("");
  const fileRef = React.useRef(null);

  const usedCats = Array.from(new Set(favorites.map((f) => f.category || "Other")));
  const allCats = Array.from(new Set([...PRESET_CATEGORIES, ...(customCategories || []), ...usedCats]));
  const shown = filter === "All" ? favorites : favorites.filter((f) => (f.category || "Other") === filter);

  const pickFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) onImport(file);
    e.target.value = "";
  };

  return (
    <Shell onClose={onClose} title={`Favorites${favorites.length ? ` (${favorites.length})` : ""}`}>
      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={pickFile} style={{ display: "none" }} />

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button className="hk-btn" onClick={() => fileRef.current && fileRef.current.click()} disabled={importing}
          style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "11px", borderRadius: 12, border: "none", background: `linear-gradient(180deg, ${C.oxblood}, ${C.oxbloodDeep})`, color: "#fff", fontWeight: 700, fontSize: 14, cursor: importing ? "default" : "pointer", opacity: importing ? 0.8 : 1 }}>
          {importing ? <Loader2 size={16} style={{ animation: "spin 1s linear infinite" }} /> : <Camera size={16} />}
          {importing ? "Reading photo…" : "Import recipe photo"}
        </button>
        <button className="hk-btn" onClick={onExport} disabled={!favorites.length}
          style={{ display: "flex", alignItems: "center", gap: 6, padding: "11px 14px", borderRadius: 12, border: `1.5px solid ${C.line}`, background: "#fff", color: C.oxblood, fontWeight: 700, fontSize: 14, cursor: favorites.length ? "pointer" : "not-allowed" }}>
          <Download size={16} /> Export
        </button>
      </div>
      <p style={{ margin: "-6px 0 12px", fontSize: 12, color: C.inkSoft }}>
        Snap or upload a photo/screenshot of any recipe and it's saved here in this format.
      </p>
      {importError && <div style={{ background: "#f8e6d4", border: `1px solid ${C.oxblood}`, color: C.oxbloodDeep, borderRadius: 10, padding: "9px 12px", fontSize: 13, marginBottom: 12 }}>{importError}</div>}

      {favorites.length === 0 ? (
        <p style={{ color: C.inkSoft, fontStyle: "italic" }}>
          No favorites yet. Tap the heart on any recipe to save the whole thing here, or import one from a photo above.
        </p>
      ) : (
        <>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 14 }}>
            {["All", ...usedCats].map((c) => {
              const on = filter === c;
              return (
                <button key={c} className="hk-chip" onClick={() => setFilter(c)}
                  style={{ padding: "6px 12px", borderRadius: 999, cursor: "pointer", fontSize: 13, fontWeight: on ? 700 : 500, border: `1.5px solid ${on ? C.oxblood : C.line}`, background: on ? C.oxblood : "#fff", color: on ? "#fff" : C.ink }}>
                  {c}
                </button>
              );
            })}
          </div>

          <div style={{ display: "grid", gap: 16 }}>
            {shown.map((f, i) => (
              <div key={(f.title || "fav") + i}>
                <RecipeCard
                  r={f}
                  index={i}
                  favView
                  animal={f.animal || "beef"}
                  open={openIdx === f.title}
                  onToggle={() => setOpenIdx(openIdx === f.title ? -1 : f.title)}
                  faved={true}
                  onFav={() => onToggleFav(f)}
                  onPrint={onPrint}
                  onAddToPlan={onAddToPlan}
                />
                <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "8px 2px 0" }}>
                  <span style={{ fontSize: 12, color: C.inkSoft }}>Category</span>
                  <select value={f.category || "Other"} onChange={(e) => onSetCategory(f.title, e.target.value)}
                    style={{ flex: 1, padding: "7px 10px", borderRadius: 9, border: `1.5px solid ${C.line}`, background: "#fff", color: C.ink, fontSize: 13, fontFamily: FONT_BODY }}>
                    {Array.from(new Set([...allCats, f.category || "Other"])).map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
            <input value={newCat} onChange={(e) => setNewCat(e.target.value)} placeholder="New category name"
              style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: `1.5px solid ${C.line}`, background: "#fff", fontSize: 13.5, fontFamily: FONT_BODY, color: C.ink }} />
            <button className="hk-btn" onClick={() => { onAddCategory(newCat); setNewCat(""); }}
              style={{ padding: "9px 14px", borderRadius: 10, border: `1.5px solid ${C.brass}`, background: "#fff", color: C.oxblood, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>
              Add
            </button>
          </div>

          <button onClick={onClear} style={{ ...textBtn(), marginTop: 14 }}>Clear all favorites</button>
        </>
      )}
    </Shell>
  );
}
